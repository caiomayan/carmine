<!doctype html>
<!--
  Liberty Final · referência do frontend.
  Ícones: Lucide 0.469.0 (https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js), traço padrão 2.
  Onde cada um é usado (nome Lucide):
  - sun / moon ........ botão de tema no cabeçalho (mostra o destino da troca)
  - search ............ campo de busca do cabeçalho
  - map-pin ........... cidade na linha de servidor; "Servidores em São Paulo" no rodapé
  - signal-high / signal-medium / signal-low ... ping bom / médio / ruim na linha de servidor
  - crown ............. selo VIP (amigos, seção Cores de contexto)
  - check ............. mensagem de sucesso ("Loadout salvo")
  - triangle-alert .... mensagem de erro (seção Cores de contexto)
  - info .............. mensagem informativa (seção Cores de contexto)
  - clock ............. nota de versão em Regras de conduta
  Para o site real: lucide-react / lucide-static com os mesmos nomes; versão fixada no CDN.
  Cores de contexto: shared/liberty-status.css (tokens --status-*, fora da identidade da marca).
-->
