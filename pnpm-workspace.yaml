packages:
  - apps/*
  - packages/*

# Versões compartilhadas entre os pacotes (usadas como "catalog:").
catalog:
  # cs2-lib: mesma versão no web (catálogo) e na API (validação), para os dois verem o mesmo catálogo.
  "@ianlucas/cs2-lib": 9.5.0
  "@types/node": 24.19.1
  typescript: 6.0.3
  vitest: 5.0.3
  zod: 4.6.5

# Só estes pacotes podem rodar scripts de instalação.
allowBuilds:
  "@biomejs/biome": true
  "@swc/core": true
  esbuild: true
  # Telemetria do swagger-ui-dist: nunca roda.
  "@scarf/scarf": false
  # Extensões nativas opcionais do cliente Docker (Testcontainers): dispensáveis.
  cpu-features: false
  ssh2: false
  protobufjs: false
  # Watcher nativo do extrator do next-intl (não usamos): dispensável.
  "@parcel/watcher": false
