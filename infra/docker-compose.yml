# Ambiente local: Postgres e Valkey para a API em desenvolvimento (`pnpm dev`).
# As credenciais são só locais; as de produção ficam fora do repositório.
name: carmine

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: carmine
      POSTGRES_PASSWORD: carmine
      POSTGRES_DB: carmine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carmine -d carmine"]
      interval: 2s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.0.6-alpine
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  valkey-data:
