// cs2-retakes 3.1.1: executado pelo plugin 1 s depois de cada mapa (ele só cria o arquivo se não
// existir, então este vale). Base: os padrões que o plugin gera; mudanças comentadas.
bot_kick
bot_quota 0
mp_autoteambalance 0
mp_forcecamera 1
mp_give_player_c4 0
mp_halftime 0
mp_ignore_round_win_conditions 0
mp_join_grace_time 0
mp_match_can_clinch 0
mp_maxmoney 0
mp_playercashawards 0
mp_respawn_on_death_ct 0
mp_respawn_on_death_t 0
mp_solid_teammates 1
mp_teamcashawards 0
mp_warmup_pausetimer 0
sv_skirmish_id 0
mp_roundtime_defuse 1.25
mp_autokick 0
mp_c4timer 40
mp_freezetime 1
mp_friendlyfire 0
// Carmine: 5 s entre rounds (padrão 2). A Vaga reservada tira o jogador sem VIP 3 s depois do fim
// do round, e o cs2-retakes só põe o VIP no jogo no round_prestart seguinte.
mp_round_restart_delay 5
sv_talk_enemy_dead 0
sv_talk_enemy_living 0
sv_deadtalk 1
spec_replay_enable 0
// Um mapa = 50 rounds (uns 35 a 40 min); o RockTheVote abre a votação 2 rounds antes do fim.
mp_maxrounds 50
mp_match_end_restart 0
mp_timelimit 0
mp_match_restart_delay 10
mp_death_drop_gun 1
mp_death_drop_defuser 1
mp_death_drop_grenade 1
mp_warmuptime 15
