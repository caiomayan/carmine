# Deploy na Oracle A1 (S09). Quem aprova é o merge no main: o ruleset exige PR e os checks
# verdes, e este workflow só roda depois que o CI inteiro do push no main terminou verde
# (docs/operacao/deploy-e-rollback.md). "Required reviewers" em environments não existe em
# repositório privado fora do Enterprise.
#
#   - Automático: push no main -> CI verde -> deploy do commit.
#   - Redeploy ou rollback: "Run workflow" com o commit (40 hex) de uma versão já publicada.
#   - Freio: variável do repositório DEPLOY_PAUSED=true suspende o deploy automático.
#   - Depois de implantar, um teste de fumaça bate nas páginas e APIs públicas. Se falhar, o
#     workflow implanta de novo o commit anterior do main (o pai do que subiu), sem nova volta.
#   - Sem os secrets abaixo (antes do passo a passo do dono), o job só avisa e termina verde.
#
# Acesso à VM: SSH pelo Cloudflare Tunnel (Access com service token), numa chave que só roda
# /opt/carmine/bin/deploy (infra/prod/bin/bootstrap.sh). Nenhuma porta da VM precisa ficar aberta.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit (40 hex) a implantar. Vazio: o main atual."
        required: false
        type: string
      sem_volta:
        description: "Não voltar ao commit anterior se o teste de fumaça falhar (usado pela própria volta)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  # Para disparar a volta automática (workflow_dispatch deste mesmo workflow).
  actions: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARED_VERSION: "2026.10.1"
  CLOUDFLARED_SHA256: "200573c872174ab449965655febadef8edfbb144ebcaa391b700b2dedbadb3cd"

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      run: ${{ steps.target.outputs.run }}
      sha: ${{ steps.target.outputs.sha }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Escolher o commit
        id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_COMMIT: ${{ inputs.commit }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          PAUSED: ${{ vars.DEPLOY_PAUSED }}
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' && secrets.CF_ACCESS_CLIENT_ID != '' }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            sha="${INPUT_COMMIT:-$GITHUB_SHA}"
          else
            sha="$RUN_SHA"
            if [ "$PAUSED" = true ]; then
              echo "::notice::DEPLOY_PAUSED=true: deploy automático suspenso (use Run workflow para implantar)."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            head="$(gh api "repos/$REPO/commits/main" --jq .sha)"
            if [ "$sha" != "$head" ]; then
              echo "::notice::$sha não é mais a ponta do main ($head): um deploy mais novo cuida disso."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit inválido: $sha"; exit 1
          fi
          if [ "$HAS_KEY" != true ]; then
            echo "::notice::Deploy ainda não configurado (faltam os secrets DEPLOY_SSH_KEY e CF_ACCESS_*): veja docs/operacao/checklist-do-dono.md."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - if: steps.target.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Instalar o cloudflared (versão e hash fixos)
        if: steps.target.outputs.run == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o cloudflared.deb "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          echo "${CLOUDFLARED_SHA256}  cloudflared.deb" | sha256sum -c -
          sudo dpkg -i cloudflared.deb

      - name: Configurar o SSH
        if: steps.target.outputs.run == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        # A chave fica no RUNNER_TEMP, que o runner apaga ao fim de cada job: no runner próprio
        # o ~/.ssh sobreviveria ao job.
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/ssh"
          install -d -m 700 "$dir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$dir/deploy_key"
          chmod 600 "$dir/deploy_key"
          printf 'ssh.stcarmine.com %s\n' "$DEPLOY_SSH_HOST_KEY" > "$dir/known_hosts"
          cat > "$dir/config" <<EOF
          Host ssh.stcarmine.com
            User deploy
            IdentityFile $dir/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $dir/known_hosts
            ServerAliveInterval 20
            ProxyCommand cloudflared access ssh --hostname %h
          EOF

      - name: Implantar
        if: steps.target.outputs.run == 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          GH_USER: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2029  # o SHA deve expandir aqui, no cliente
          # stdin: usuário, token (só vale durante este job) e o tar de infra/prod do commit.
          { printf '%s\n%s\n' "$GH_USER" "$GH_TOKEN"; tar -czf - infra/prod; } \
            | ssh -F "$RUNNER_TEMP/ssh/config" ssh.stcarmine.com "sha-$SHA"

      # O deploy.sh da VM já volta sozinho se um contêiner não fica saudável. Este teste confere o
      # site de fora, pelo Cloudflare, como um visitante.
      - name: Teste de fumaça em produção
        id: smoke
        if: steps.target.outputs.run == 'true'
        run: |
          set -uo pipefail
          check() { # check <caminho> <status esperado>
            for _ in $(seq 1 12); do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://stcarmine.com$1")"
              [ "$code" = "$2" ] && { echo "ok  $1 -> $code"; return 0; }
              sleep 10
            done
            echo "::error::$1 respondeu $code (esperado $2)"; return 1
          }
          ok=0
          for p in / /healthz /api/health /ranking /entrar /loadout /inventario /api/stats/week /api/activity/recent; do
            check "$p" 200 || ok=1
          done
          check /pagina-que-nao-existe-smoke 404 || ok=1
          # Um arquivo do public/ (a arte dos mapas): a imagem do web precisa levá-lo.
          check /maps/mirage/d0-480.webp 200 || ok=1
          exit "$ok"

      - name: Voltar ao commit anterior
        if: failure() && steps.smoke.outcome == 'failure' && inputs.sem_volta != true
        env:
          SHA: ${{ steps.target.outputs.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prev="$(gh api "repos/$REPO/commits/$SHA" --jq '.parents[0].sha')"
          echo "::warning::teste de fumaça falhou em $SHA: implantando de novo $prev"
          gh workflow run deploy.yml --repo "$REPO" --ref main -f commit="$prev" -f sem_volta=true

  # Só depois do teste de fumaça VERDE (o job `deploy` inteiro passou): registra o commit que está em produção e promove
  # o plugin do CS2 cuja API já está no ar (infra/cs2/release/promote-plugin.sh; docs/operacao/lancamento-cs2.md).
  # Job à parte para que só ele tenha `contents: write`; o job que implanta continua só com leitura.
  promote-plugin:
    name: promover o plugin do CS2
    needs: deploy
    if: needs.deploy.result == 'success' && needs.deploy.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.deploy.outputs.sha }}

      # A tag móvel `prod-live` diz a quem precisar (a promoção do plugin, uma pessoa) qual commit está no ar.
      - name: Registrar o commit em produção (tag prod-live)
        env:
          SHA: ${{ needs.deploy.outputs.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/git/ref/tags/prod-live" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/prod-live" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/prod-live -f sha="$SHA" >/dev/null
          fi
          echo "prod-live -> $SHA"

      - name: Promover o plugin do CS2 (se a API dele já está no ar)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PLUGIN_PROMOTION_PAUSED: ${{ vars.PLUGIN_PROMOTION_PAUSED }}
        run: bash infra/cs2/release/promote-plugin.sh --deployed "${{ needs.deploy.outputs.sha }}"
