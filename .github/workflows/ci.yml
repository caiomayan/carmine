# CI do monorepo. Os nomes dos jobs (node, dotnet, api-image, web-image) são os checks exigidos
# pelo ruleset do main; não renomeie sem atualizar o ruleset (infra/github/main-ruleset.json).
# web-image e ops-image ainda não são exigidos pelo ruleset. O deploy (deploy.yml) só roda
# depois que este workflow inteiro termina verde no main.
#
# Runner: a variável do repositório CI_RUNNER escolhe onde os jobs rodam (JSON, ex.:
# ["self-hosted","carmine"] para o runner próprio, docs/operacao/runner-proprio.md). Sem ela,
# rodam nos runners do GitHub.
#
# node e dotnet só rodam no PR: o ruleset exige o branch atualizado com o main, então o squash
# no main tem a mesma árvore que o PR já testou. No push ficam só as imagens, que o deploy usa.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  node:
    name: node
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 35
    env:
      # Os 4 vCPUs do runner do GitHub; no runner próprio evita 11 bancos de teste ao mesmo tempo.
      VITEST_MAX_WORKERS: "4"
      # Portas próprias para o Postgres e o Valkey do E2E: no runner próprio, o WSL divide a rede
      # com o Docker Desktop, onde o desenvolvimento já ocupa 5432 e 6379.
      POSTGRES_PORT: "55432"
      VALKEY_PORT: "56379"
      E2E_DATABASE_URL: postgres://carmine:carmine@localhost:55432/carmine_e2e
      VALKEY_URL: redis://localhost:56379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # Integração com Postgres e Valkey reais via Testcontainers (Docker do runner).
      - run: pnpm test
      # E2E do web contra os builds de produção do passo anterior (smoke, temas, 404, axe e o
      # login Steam completo da S03): o Playwright sobe a Steam OpenID falsa, a API e o web; a
      # API precisa do Postgres e do Valkey do Compose.
      - run: pnpm infra:up
      - run: pnpm --filter @carmine/web exec playwright install --with-deps chromium
      - run: pnpm --filter @carmine/web test:e2e
      - name: OpenAPI versionado está atualizado
        run: |
          pnpm --filter @carmine/api openapi:generate
          git diff --exit-code -- apps/api/openapi.json || {
            echo "::error::apps/api/openapi.json desatualizado. Rode 'pnpm --filter @carmine/api openapi:generate' e faça commit."
            exit 1
          }
      # No runner próprio o Docker é persistente: não deixar o Postgres e o Valkey do E2E de pé.
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  dotnet:
    name: dotnet
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          # Fora do /usr/share/dotnet, que no runner próprio não é gravável.
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          global-json-file: plugins/global.json
      - run: dotnet build Carmine.Plugins.slnx -c Release
      - run: dotnet test --solution Carmine.Plugins.slnx -c Release --no-build

  api-image:
    name: api-image
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/carmine-api
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      # Em PR só constrói (amd64 + arm64); publica no GHCR apenas no push para o main.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-image:
    name: web-image
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/carmine-web
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      # Em PR só constrói (amd64 + arm64); publica no GHCR apenas no push para o main.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  ops-image:
    name: ops-image
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/carmine-ops
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      # Em PR só constrói (amd64 + arm64); publica no GHCR apenas no push para o main.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/ops.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ops
          cache-to: type=gha,mode=max,scope=ops
