# CI do monorepo, nos runners do GitHub (repositório público: minutos ilimitados, inclusive ARM).
#
#   - PR para o dev ou para o main: checagem completa em paralelo. verify (lint, tipagem, build,
#     unitários e OpenAPI), integração com Postgres/Valkey reais, E2E em 3 partes e .NET. O job
#     `node` junta tudo e é o check que o ruleset do main exige (infra/github/main-ruleset.json).
#   - Push no main: só as imagens arm64, nativas no runner ARM (a VM de produção é ARM). O deploy
#     (deploy.yml) roda depois que este workflow termina verde.
#   - Push no dev: as mesmas imagens (sem a tag `latest`), para a homologação (deploy-hml.yml).
#   - "Run workflow": a mesma checagem completa em qualquer branch.
#
# PRs de forks só rodam com aprovação (configuração do repositório) e não recebem secrets.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  verify:
    name: verify
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O mesmo `pnpm verify` que os agentes rodam antes do PR.
      - run: pnpm verify
      - name: OpenAPI versionado está atualizado
        run: |
          pnpm --filter @carmine/api openapi:generate
          git diff --exit-code -- apps/api/openapi.json || {
            echo "::error::apps/api/openapi.json desatualizado. Rode 'pnpm --filter @carmine/api openapi:generate' e faça commit."
            exit 1
          }

  integration:
    name: integration
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @carmine/contracts build
      # Postgres e Valkey reais via Testcontainers (Docker do runner).
      - run: pnpm --filter @carmine/api test:integration

  e2e:
    name: e2e (${{ matrix.shard }}/3)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O E2E roda contra os builds de produção (smoke, temas, axe, orçamento de JS e o login
      # Steam completo): o Playwright sobe a Steam OpenID falsa, a API e o web.
      - run: pnpm build
      - run: pnpm infra:up
      - run: pnpm --filter @carmine/web exec playwright install --with-deps chromium
      - run: pnpm --filter @carmine/web test:e2e --shard=${{ matrix.shard }}/3
      # O orçamento de JS por página (js-budget.json: 360 kB, Perfil 425), medido neste mesmo build de
      # produção com uma Conta semeada. Roda numa parte só (a tabela por página vai para o log e para o
      # resumo do job) e reprova o PR se alguma página estourar, mesmo se um teste do E2E falhou.
      - if: ${{ !cancelled() && matrix.shard == 1 }}
        run: pnpm --filter @carmine/web budget:js:ci
      # Os traces das falhas, para diagnosticar sem rodar de novo.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-falhas-${{ matrix.shard }}
          path: apps/web/test-results/
          retention-days: 7

  dotnet:
    name: dotnet
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: plugins/global.json
      - run: dotnet build Carmine.Plugins.slnx -c Release
      - run: dotnet test --solution Carmine.Plugins.slnx -c Release --no-build

  # O check exigido pelo ruleset do main: verde só se todos os jobs acima ficaram verdes.
  node:
    name: node
    if: always() && github.event_name != 'push'
    needs: [verify, integration, e2e, dotnet]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::um dos jobs não passou ($r)"; exit 1; }; done

  # Imagens publicadas no GHCR a cada push no main (produção) e no dev (homologação), em arm64
  # nativo (a VM é ARM). A tag `latest` é só do main.
  image:
    name: ${{ matrix.name }}-image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            dockerfile: infra/docker/api.Dockerfile
            scope: api
          - name: web
            dockerfile: infra/docker/web.Dockerfile
            scope: web
          - name: ops
            dockerfile: infra/docker/ops.Dockerfile
            scope: ops
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/carmine-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.scope }}-arm
          cache-to: type=gha,mode=max,scope=${{ matrix.scope }}-arm
